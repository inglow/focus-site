<!doctype html>
<!--
  L'accueil du site : il ne sert qu'à ne pas laisser l'adresse vide. Comme la
  page d'invitation, il ne charge rien (la politique de sécurité l'interdit) et
  ne porte pas le nom de l'app, provisoire.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Liens de l'application</title>
    <style>
      body {
        margin: 0;
        padding: 32px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #0a1f14;
        background: #ffffff;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
      }
      p {
        font-size: 15px;
        line-height: 22px;
        color: #4a5a52;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rien à voir ici</h1>
      <p>
        Cette adresse sert aux liens que l'application envoie par e-mail. Pour
        accepter une invitation, ouvrez le lien reçu depuis votre téléphone.
      </p>
    </main>
  </body>
</html>
